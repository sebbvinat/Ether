name: Backfill histórico

# §13 — trae historia vieja a Supabase. El endpoint de Vercel ingesta un chunk
# acotado por llamada (los 60s de request de Hobby no dan para más), así que
# el loop vive acá: los runners de GitHub no tienen ese límite y son gratis
# en repos públicos.
#
# Uso: Actions → "Backfill histórico" → Run workflow, y completar los inputs.

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Símbolo (BTCUSDT, ETHUSDT, ^GSPC, ^IXIC, ^DJI…)"
        required: true
        default: "BTCUSDT"
      tf:
        description: "Timeframe (1m, 15m, 1h, 4h, 1d…)"
        required: true
        default: "1h"
      fromDate:
        description: "Hasta qué fecha ir hacia atrás (YYYY-MM-DD)"
        required: true
        default: "2020-01-01"
      maxIterations:
        description: "Tope de chunks (cada uno ≈30k velas)"
        required: false
        default: "200"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ingestar chunks hasta cubrir el rango
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYMBOL: ${{ inputs.symbol }}
          TF: ${{ inputs.tf }}
          FROM_DATE: ${{ inputs.fromDate }}
          MAX_ITER: ${{ inputs.maxIterations }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Faltan los secrets VERCEL_URL o CRON_SECRET"
            exit 1
          fi

          from_ms=$(( $(date -u -d "${FROM_DATE}" +%s) * 1000 ))
          to_ms=$(( $(date -u +%s) * 1000 ))
          total_inserted=0
          i=0

          echo "Backfill ${SYMBOL} ${TF} desde ${FROM_DATE} (${from_ms}ms) hacia atrás desde ahora."

          while [ "$i" -lt "${MAX_ITER}" ]; do
            i=$((i + 1))
            # --get + --data-urlencode para que símbolos como ^GSPC no rompan la URL.
            response=$(curl -sS -w "\n%{http_code}" --get \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              --data-urlencode "symbol=${SYMBOL}" \
              --data-urlencode "tf=${TF}" \
              --data-urlencode "fromMs=${from_ms}" \
              --data-urlencode "toMs=${to_ms}" \
              "${VERCEL_URL}/api/admin/backfill")
            body=$(echo "$response" | head -n -1)
            status=$(echo "$response" | tail -n 1)

            if [ "$status" != "200" ]; then
              echo "::error::Chunk $i falló con HTTP $status"
              echo "$body" | head -c 2000
              exit 1
            fi

            inserted=$(echo "$body" | jq -r '.inserted // 0')
            fetched=$(echo "$body" | jq -r '.fetched // 0')
            done_flag=$(echo "$body" | jq -r '.done')
            next_to=$(echo "$body" | jq -r '.nextToMs')
            total_inserted=$((total_inserted + inserted))

            echo "chunk $i: fetched=${fetched} inserted=${inserted} nextToMs=${next_to} done=${done_flag}"

            if [ "$done_flag" = "true" ]; then
              echo "Cubierto el rango completo."
              break
            fi
            # Sin avance no hay razón para seguir: evita loopear en el mismo punto.
            if [ "$next_to" = "null" ] || [ "$next_to" -ge "$to_ms" ]; then
              echo "::warning::El cursor no avanzó (nextToMs=${next_to}); corto acá."
              break
            fi
            to_ms=$next_to
            sleep 1
          done

          echo "---"
          echo "Chunks: $i · Filas insertadas: ${total_inserted}"
          echo "### Backfill ${SYMBOL} ${TF}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Desde: ${FROM_DATE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Chunks: ${i}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Filas insertadas: ${total_inserted}" >> "$GITHUB_STEP_SUMMARY"
